<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting...</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var slug = window.location.pathname.replace(/^\/+/, "");
        var target =
          "https://mdnaimurrahman.com/" +
          slug +
          window.location.search +
          window.location.hash;
        window.location.replace(target);
      })();
    </script>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
      }
      .box {
        text-align: center;
        padding: 1.5rem;
      }
      a {
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <h1>Redirecting...</h1>
      <p>
        If you are not redirected automatically,
        <a href="https://mdnaimurrahman.com/">click here</a>.
      </p>
    </main>
  </body>
</html>
