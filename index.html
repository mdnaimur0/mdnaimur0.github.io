<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Moved | Md. Naimur Rahman</title>
    <meta
      name="description"
      content="Md. Naimur Rahman's personal website has moved to a new domain."
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta http-equiv="refresh" content="0; url=https://mdnaimurrahman.com/" />
    <link rel="canonical" href="https://mdnaimurrahman.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Md. Naimur Rahman" />
    <meta
      property="og:description"
      content="The website has moved to mdnaimurrahman.com."
    />
    <meta property="og:url" content="https://mdnaimurrahman.com/" />
    <meta property="og:site_name" content="Md. Naimur Rahman" />
    <meta
      property="og:image"
      content="https://mdnaimurrahman.com/opengraph-image.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Md. Naimur Rahman" />
    <meta
      name="twitter:description"
      content="The website has moved to mdnaimurrahman.com."
    />
    <meta
      name="twitter:image"
      content="https://mdnaimurrahman.com/opengraph-image.png"
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />

    <script>
      (function () {
        var targetUrl = "https://mdnaimurrahman.com/";

        function redirectNow() {
          if (window.location.href !== targetUrl) {
            window.location.replace(targetUrl);
          }
        }

        // Redirect on the next paint so the loading state is visible if needed.
        if ("requestAnimationFrame" in window) {
          window.requestAnimationFrame(redirectNow);
        } else {
          redirectNow();
        }
      })();
    </script>

    <style>
      :root {
        color-scheme: light;
        --bg-1: #f8fafc;
        --bg-2: #e2e8f0;
        --fg: #0f172a;
        --muted: #334155;
        --accent: #003ba1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, sans-serif;
        color: var(--fg);
        background:
          radial-gradient(
            circle at 20% 20%,
            rgba(14, 165, 233, 0.16),
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 10%,
            rgba(2, 132, 199, 0.1),
            transparent 45%
          ),
          linear-gradient(165deg, var(--bg-1), var(--bg-2));
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .loader {
        width: min(20rem, calc(100vw - 2rem));
        padding: 2rem;
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.45);
        backdrop-filter: blur(10px);
        text-align: center;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.14);
        animation: appear 420ms ease-out;
      }

      .spinner {
        width: 2.5rem;
        height: 2.5rem;
        margin: 0 auto 1rem;
        border-radius: 50%;
        border: 3px solid rgba(14, 165, 233, 0.22);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.05rem, 1.8vw, 1.35rem);
        letter-spacing: 0.02em;
      }

      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
        line-height: 1.45;
        font-size: 0.96rem;
      }

      a {
        color: #0369a1;
        font-weight: 600;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <main
      class="loader"
      role="status"
      aria-live="polite"
      aria-label="Redirecting to the new domain"
    >
      <div class="spinner" aria-hidden="true"></div>
      <h1>Redirecting to the new website</h1>
      <p>
        This website has moved to
        <a href="https://mdnaimurrahman.com/" rel="noopener"
          >mdnaimurrahman.com</a
        >.
      </p>
    </main>

    <noscript>
      <p>
        JavaScript is disabled. Continue to
        <a href="https://mdnaimurrahman.com/">mdnaimurrahman.com</a>.
      </p>
    </noscript>
  </body>
</html>
